<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tweet Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="col">
  <header class="profile">
    <div class="banner"></div>
    <div class="profile-row">
      <div class="avatar big" id="avatar">D</div>
    </div>
    <h1 id="name"></h1>
    <div class="muted" id="handle"></div>
    <p id="bio"></p>
    <div class="muted small" id="count">Loading saved entries…</div>
  </header>
  <nav class="tabs" aria-label="Saved conversation filters">
    <button type="button" data-filter="all" class="active" aria-pressed="true">All</button>
    <button type="button" data-filter="posts" aria-pressed="false">Posts</button>
    <button type="button" data-filter="replies" aria-pressed="false">Replies</button>
    <button type="button" data-filter="grok" aria-pressed="false">Grok</button>
  </nav>
  <p class="feed-summary muted small" id="coverage" aria-live="polite"></p>
  <section id="feed"><p class="empty">Loading…</p></section>
</main>
<script src="media.js"></script>
<script src="conversation.js"></script>
<script src="render.js"></script>
<script>
(async () => {
  const feed = document.getElementById('feed');
  try {
    const res = await fetch('tweets.json?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json(), graph=TweetHubConversations.build(data);
    const p = data.profile || {};
    document.getElementById('name').textContent = p.name || '';
    document.getElementById('handle').textContent = p.handle ? '@' + p.handle : '';
    document.getElementById('bio').textContent = p.bio || '';
    document.getElementById('avatar').outerHTML = avatarHtml(p, (p.name || '?')[0], 'avatar big');
    const stats=graph.stats;
    document.getElementById('count').textContent=stats.ownerEntries+' own entries · '+stats.replies+' replies · '+stats.grok+' Grok entries';
    function show(filter='all') {
      const conversations=TweetHubConversations.select(graph,filter), matching=[...graph.nodes.values()].filter(node=>TweetHubConversations.matches(node,filter)).length;
      const unknown=stats.unknownReplyStatus?stats.unknownReplyStatus+' own entries have unconfirmed reply status. ':'';
      document.getElementById('coverage').textContent=filter==='all'?stats.savedEntries+' unique saved entries. '+unknown+'Known conversation context is included.':matching+' matching '+(filter==='grok'?'Grok entries':filter)+' in '+conversations.length+' conversations. Context is included.';
      feed.innerHTML=conversations.length?'':'<p class="empty">'+(filter==='posts'?'No standalone posts have confirmed context yet.':'No matching saved entries.')+'</p>';
      conversations.forEach(conversation=>feed.appendChild(renderConversation(conversation,graph,filter)));
      document.querySelectorAll('[data-filter]').forEach(button=>{const active=button.dataset.filter===filter;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});
    }
    document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>show(button.dataset.filter));
    show();
  } catch (e) {
    feed.innerHTML = '<p class="empty">Could not load posts.</p>';
  }
})();
</script>
</body>
</html>
