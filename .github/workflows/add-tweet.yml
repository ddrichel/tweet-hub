name: Add post
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: add-tweet
jobs:
  add:
    # Only issues opened by the repo owner with a "tweet:" title are accepted.
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'tweet:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add post to tweets.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/add-tweet.js
      - name: Preserve captured media files
        run: node scripts/mirror-media.js
      - name: Commit
        env:
          COMMIT_TITLE: ${{ github.event.issue.title }}
        run: |
          node scripts/privacy-guard.js
          git config user.name "tweet-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tweets.json
          if [ -d media ]; then git add media; fi
          git diff --cached --quiet && echo "No change" || git commit -m "$COMMIT_TITLE"
          git push
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Added to the timeline ✓"

