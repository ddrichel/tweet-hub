name: Preserve original post media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mirror-media.js
      - .github/workflows/archive-media.yml
permissions:
  contents: write
concurrency:
  group: add-tweet
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve source media
        run: node scripts/mirror-media.js
      - name: Verify saved source and rendering
        run: npm test
      - name: Commit media copies
        run: |
          git add tweets.json
          if [ -d media ]; then git add media; fi
          node scripts/privacy-guard.js
          if ! git diff --cached --quiet; then
            git config user.name "tweet-hub-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve original post media files"
            git pull --rebase origin main
            git push
          fi
